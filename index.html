<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iD7AA — Links</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0a0a0f;
    --card:    #1c1c28;
    --border:  rgba(255,255,255,0.07);
    --accent:  #7c6fff;
    --accent2: #ff6b9d;
    --text:    #e8e8f0;
    --muted:   #6b6b85;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 56px 20px 80px;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(124,111,255,0.13) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Avatar ── */
  .avatar {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; color: #fff;
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px rgba(124,111,255,0.4);
    margin-bottom: 18px;
  }

  .name {
    font-size: 26px; font-weight: 700;
    background: linear-gradient(90deg, #fff 0%, rgba(255,255,255,0.65) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .handle { font-size: 14px; color: var(--accent); margin-bottom: 8px; }
  .bio { font-size: 13px; color: var(--muted); margin-bottom: 40px; text-align: center; }

  /* ── Links ── */
  .links { width: 100%; display: flex; flex-direction: column; gap: 10px; }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  }
  .link-card:hover {
    transform: translateY(-2px);
    border-color: rgba(124,111,255,0.35);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .link-icon {
    width: 44px; height: 44px;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 22px;
  }

  .link-info { flex: 1; }
  .link-title { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 2px; }
  .link-sub   { font-size: 12px; color: var(--muted); }
  .link-arrow { font-size: 18px; color: var(--muted); transition: color 0.2s, transform 0.2s; }
  .link-card:hover .link-arrow { color: var(--accent); transform: translateX(-3px); }

  /* icon colors */
  .icon-tiktok   { background: #111; border: 1px solid rgba(255,255,255,0.1); }
  .icon-youtube  { background: #1a0000; border: 1px solid rgba(255,70,70,0.2); }
  .icon-whatsapp { background: #0a1a0a; border: 1px solid rgba(37,211,102,0.2); }
  .icon-kick     { background: #0a1a0a; border: 1px solid rgba(83,252,28,0.25); }

  .footer {
    margin-top: 44px;
    font-size: 11px;
    color: var(--muted);
    opacity: 0.45;
  }

  @media (max-width: 480px) {
    body { padding: 36px 16px 60px; }
    .name { font-size: 22px; }
  }
</style>
</head>
